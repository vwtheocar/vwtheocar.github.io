<!DOCTYPE html>
<html>

<head>
  <title>VW Group Parts Theo</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding-top: 80px;
      background-color: #f5f5f5;
      color: #111;
      text-align: center;
    }

    /* TOP BAR (ΜΑΥΡΗ) */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #111;
      color: #fff;
      font-size: 14px;
      letter-spacing: 1.5px;
      padding: 8px 15px;
      z-index: 9999;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    .phone-number {
      color: #fff;
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* NAV BAR (ΓΑΛΑΖΙΑ) */
    .nav-bar {
      background: #b9d9ff;
      border-bottom: 1px solid #8fbef0;
      padding: 5px 0;
      text-align: center;
    }

    .nav-bar a {
      margin: 0 28px;
      text-decoration: none;
      color: #0b1b2b;
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 500;
    }

    .nav-bar a:hover {
      font-weight: bold;
    }

    /* HEADER (ΜΠΛΕ) */
    .header {
      background: linear-gradient(90deg, #003399, #002a6b);
      color: white;
      padding: 28px 10px 10px 10px;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto;
    }

    .title {
      text-align: center;
      flex: 1;
    }

    .title-main {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .title-sub {
      font-size: 15px;
      margin-top: 6px;
      opacity: 0.95;
      font-weight: 600;
    }

    .logos {
      display: flex;
      gap: 28px;
      align-items: center;
      justify-content: flex-end;
    }

    .logos img {
      width: 78px;
      height: 78px;
      object-fit: contain;
    }

    /* TAGLINE (ΔΕΝ ΕΙΝΑΙ ΜΠΑΡΑ) */
    .tagline {
      margin-top: 8px;
      font-size: 13px;
      letter-spacing: 0.5px;
      opacity: 0.9;
      line-height: 1.5;
    }

    /* CONTENT */
    .category {
      display: flex;
      align-items: center;
      background: #e8f0ff;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 10px;
      text-decoration: none;
      color: #111;
      border: 1px solid #c9dbff;
      font-size: 15px;
    }

    .dot {
      margin-right: 12px;
      color: #003399;
    }

    .icon {
      width: 92px;
      height: 92px;
      background: #dfe9ff;
      border-radius: 8px;
      margin-right: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7aa8;
      font-size: 12px;
    }

    /* FOOTER */
    .footer {
      margin-top: 60px;
      padding: 25px 10px;
      background: #002a6b;
      color: white;
      font-size: 13px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      max-width: 1000px;
      margin: 0 auto;
    }

    .footer-block {
      flex: 1;
    }

    .footer-left {
      text-align: left;
      font-weight: bold;
      font-size: 14px;
    }

    .footer-sub {
      font-weight: normal;
      font-size: 12px;
      margin-top: 6px;
      opacity: 0.9;
    }

    .footer-center {
      text-align: center;
      line-height: 1.8;
    }

    .footer-right {
      text-align: right;
    }

    .footer-title {
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 13px;
      color: orange;
    }

    .footer-links {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    a {
      color: white;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .header-inner {
        flex-direction: column;
        gap: 10px;
      }

      .logos {
        justify-content: center;
      }

      .title-main {
        font-size: 26px;
      }

      .category {
        font-size: 16px;
        padding: 16px;
      }

      .icon {
        width: 80px;
        height: 80px;
      }

      .footer-inner {
        flex-direction: column;
        text-align: center;
        gap: 15px;
      }

      .footer-left,
      .footer-center,
      .footer-right {
        text-align: center;
      }

      .footer-links {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    ΓΙΑ ΠΑΡΑΓΓΕΛΙΑ ΚΑΛΕΣΤΕ 👉 <span class="phone-number">6987168152</span>
  </div>

  <div class="nav-bar">
    <a href="index.html">ΑΡΧΙΚΗ</a>
    <a href="offers.html">ΠΡΟΣΦΟΡΕΣ</a>
    <a href="shipping.html">ΤΡΟΠΟΙ ΑΠΟΣΤΟΛΗΣ</a>
    <a href="#contact">ΕΠΙΚΟΙΝΩΝΙΑ</a>
  </div>

  <div class="header">

    <div class="header-inner">

      <div class="title">
        <div class="title-main">VW Group Parts Theo</div>
        <div class="title-sub">Ανταλλακτικά εσωτερικού χώρου</div>
      </div>

      <div class="logos">
        <img src="vw.png">
        <img src="audi.png">
        <img src="skoda.png">
        <img src="seat.png">
      </div>

    </div>

    <div class="tagline">
      Εξειδίκευση σε ανταλλακτικά VW Group εσωτερικού χώρου • Aftermarket & γνήσια μεταχειρισμένα • Δυσεύρετα και σπάνια κομμάτια
    </div>

  </div>

  <div style="margin-top:15px; font-size:18px;">
    👇 Βρες εδώ αυτό που ψάχνεις
  </div>

</body>
</html>
