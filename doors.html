<!DOCTYPE html>
<html>
<head>
  <title>VW Theo Car - Χειρολαβές</title>
</head>

<body style="font-family: Arial; background-color: #f5f5f5; text-align: center; margin-top: 80px; color: #111;">

  <!-- HEADER -->
  <div style="padding: 30px; background-color: #003399; color: white;">
    <h1 style="margin: 0;">Χειρολαβές Ουρανού</h1>
  </div>

  <!-- BACK BUTTON -->
  <p style="margin-top: 20px;">
    <a href="index.html" style="color: #003399; font-weight: bold; text-decoration: none;">
      ← Επιστροφή στην αρχική
    </a>
  </p>
  <div style="margin-top: 20px;">
  <button onclick="filterCards('all')" style="padding:8px 12px; margin:5px;">Όλα</button>
  <button onclick="filterCards('golf')" style="padding:8px 12px; margin:5px;">Golf</button>
  <button onclick="filterCards('passat')" style="padding:8px 12px; margin:5px;">Passat</button>
  <button onclick="filterCards('audi')" style="padding:8px 12px; margin:5px;">Audi</button>
</div>

  <!-- CONTENT -->
  <div style="text-align: center; margin-top: 40px;">

    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">

      <!-- CARD 1 -->
      <div class="card golf" style="padding: 18px; border: 1px solid #ddd; background-color: #ffffff; width: 260px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
        <h3>Χειρολαβή Ουρανού VW Golf 5</h3>
        <p>Κωδικός: 1K0 XXXX</p>
        <p><b>Διαθέσιμο</b></p>

        <a href="#" style="display:inline-block; margin-top:10px; padding:8px 12px; background-color:#003399; color:white; text-decoration:none; border-radius:5px;">
          Λεπτομέρειες
        </a>
      </div>

      <!-- CARD 2 -->
      <div class="card golf" style="padding: 18px; border: 1px solid #ddd; background-color: #ffffff; width: 260px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
        <h3>Χειρολαβή Ουρανού VW Golf 5</h3>
        <p>Κωδικός: 1K0 XXXX</p>
        <p><b>Διαθέσιμο</b></p>

        <a href="#" style="display:inline-block; margin-top:10px; padding:8px 12px; background-color:#003399; color:white; text-decoration:none; border-radius:5px;">
          Λεπτομέρειες
        </a>
      </div>

      <!-- CARD 3 -->
      <div class="card golf" style="padding: 18px; border: 1px solid #ddd; background-color: #ffffff; width: 260px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
        <h3>Χειρολαβή Ουρανού VW Golf 5</h3>
        <p>Κωδικός: 1K0 XXXX</p>
        <p><b>Διαθέσιμο</b></p>

        <a href="#" style="display:inline-block; margin-top:10px; padding:8px 12px; background-color:#003399; color:white; text-decoration:none; border-radius:5px;">
          Λεπτομέρειες
        </a>
      </div>

    </div>

  </div>
<script>
function filterCards(type) {
  const cards = document.querySelectorAll('.card');

  cards.forEach(card => {
    if (type === 'all') {
      card.style.display = 'block';
    } else {
      if (card.classList.contains(type)) {
        card.style.display = 'block';
      } else {
        card.style.display = 'none';
      }
    }
  });
}
</script>
</body>
</html>
