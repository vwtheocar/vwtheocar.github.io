<!DOCTYPE html>
<html>

<head>
  <title>Χειρολαβές Πόρτας</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding-top: 80px;
      background-color: #f5f5f5;
      color: #111;
      text-align: center;
    }

    .header {
      background: linear-gradient(90deg, #003399, #002a6b);
      color: white;
      padding: 25px 10px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.9;
      margin-top: 5px;
    }

    .box {
      max-width: 700px;
      margin: 30px auto;
      text-align: left;
    }

    .item {
      display: flex;
      align-items: center;
      background: white;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .code {
      font-weight: bold;
      color: #003399;
      min-width: 140px;
    }

    .desc {
      font-size: 14px;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 15px;
      background: #003399;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .back:hover {
      background: #002266;
    }

    @media (max-width: 768px) {
      .item {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }

      .code {
        min-width: auto;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <div class="title">Χειρολαβές Πόρτας</div>
    <div class="subtitle">VW Group ανταλλακτικά εσωτερικού χώρου</div>
  </div>

  <!-- CONTENT -->
  <div class="box">

    <div class="item">
      <div class="code">1K0837113</div>
      <div class="desc">Χειρολαβή πόρτας VW Golf / Passat / Octavia</div>
    </div>

    <div class="item">
      <div class="code">3B0837205</div>
      <div class="desc">Εσωτερική χειρολαβή VW Group</div>
    </div>

    <div class="item">
      <div class="code">8E0837207</div>
      <div class="desc">Audi A4 εσωτερική χειρολαβή</div>
    </div>

  </div>

  <a class="back" href="index.html">⬅ Πίσω</a>

</body>

</html>
