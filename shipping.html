<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Τρόποι Αποστολής</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      color: #111;
    }

    .box {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    h2 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .method {
      padding: 15px 0;
    }

    .method strong {
      display: block;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .method span {
      display: block;
      font-size: 14px;
      line-height: 1.6;
    }

    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 10px 0;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>Επιλογές Αποστολής</h2>

    <div class="method">
      <strong>1. ACS</strong>
      <span>Χρόνος παράδοσης: 1-2 μέρες<br>
      Κόστος: 4,50€ - 7,50€<br>
      Αντικαταβολή: 2,00€</span>
    </div>

    <hr>

    <div class="method">
      <strong>2. ΚΤΕΛ</strong>
      <span>Παράδοση την ίδια μέρα (εκτός νησιών)<br>
      Κόστος: 5€ - 8€<br>
      Χωρίς αντικαταβολή</span>
    </div>

    <hr>

    <div class="method">
      <strong>3. ΕΛΤΑ</strong>
      <span>2-5 μέρες<br>
      Κόστος: 3,50€<br>
      Χωρίς αντικαταβολή</span>
    </div>

  </div>

</body>
</html>
